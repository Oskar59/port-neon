<script type="module">
import * as THREE from 'three';

'use strict';
const T=48, TAU=Math.PI*2, SW=2.5;
const GRASS=0, ROAD=1, WALK=2, BLD=3, WATER=4, LOT=5, SAND=6;
const DIRS=[[1,0],[0,1],[-1,0],[0,-1]];
const D4=[0,Math.PI/2,Math.PI,-Math.PI/2];

const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const hyp=Math.hypot;
const lerp=(a,b,t)=>a+(b-a)*t;
function angDiff(a,b){let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;}
function hash(x,y){let h=(x*374761393+y*668265263)|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}
function shade(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16&255,g=n>>8&255,b=n&255;
  if(f<0){r*=1+f;g*=1+f;b*=1+f;}else{r+=(255-r)*f;g+=(255-g)*f;b+=(255-b)*f;}
  return '#'+((1<<24)|((r|0)<<16)|((g|0)<<8)|(b|0)).toString(16).slice(1);}
function mixHex(a,b,t){const A=parseInt(a.slice(1),16),B=parseInt(b.slice(1),16);
  const r=lerp(A>>16&255,B>>16&255,t),g=lerp(A>>8&255,B>>8&255,t),bl=lerp(A&255,B&255,t);
  return '#'+((1<<24)|((r|0)<<16)|((g|0)<<8)|(bl|0)).toString(16).slice(1);}

// =====================================================================
//  CARTE — grille irrégulière, quartiers, avenues, plage
// =====================================================================
const MARGIN=5, NBX=13, NBY=13;
function genAxis(n){const R=[],Wd=[];let pos=MARGIN;const av=new Set(n>=12?[3,7,10]:[3,7]);
  for(let i=0;i<=n;i++){const w=av.has(i)?4:2;R.push(pos);Wd.push(w);pos+=w;if(i<n)pos+=pick([9,10,11,11,12,13,13,15]);}
  return {R,W:Wd,end:pos};}
const _rand=Math.random;{let sd=20261119;Math.random=function(){sd|=0;sd=sd+0x6D2B79F5|0;let t=Math.imul(sd^sd>>>15,1|sd);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const AX=genAxis(NBX),AY=genAxis(NBY);
const RX=AX.R,WX=AX.W,RY=AY.R,WY=AY.W,NX=RX.length-1,NY=RY.length-1;
const MT=Math.max(AX.end,AY.end)+MARGIN;
const icx=i=>(RX[i]+WX[i]/2)*T, icy=j=>(RY[j]+WY[j]/2)*T;
const map=new Uint8Array(MT*MT), inBlock=new Uint8Array(MT*MT);
const buildings=[],houses=[],trees=[],lots=[],blocks=[],parkedSpots=[];
const tile=(x,y)=>(x<0||y<0||x>=MT||y>=MT)?WATER:map[y*MT+x];
const tileAt=(x,y)=>tile(Math.floor(x/T),Math.floor(y/T));
const solidT=t=>t===BLD||t===WATER;
const solidAt=(x,y)=>solidT(tileAt(x,y));
const wallAt=(x,y)=>tileAt(x,y)===BLD;
const OOB=(x,y)=>x<-30*T||y<-30*T||x>(MT+30)*T||y>(MT+30)*T;
function pBlocked(x,y,r){if(player.inside)return intBlocked(player.inside,x,y,r);return OOB(x,y)||wallAt(x-r,y)||wallAt(x+r,y)||wallAt(x,y-r)||wallAt(x,y+r);}
function groundH(x,y){const tx=Math.floor(x/T),ty=Math.floor(y/T);if(tx<0||ty<0||tx>=MT||ty>=MT)return 0;return inBlock[ty*MT+tx]?SW:0;}
const set=(x,y,t)=>{map[y*MT+x]=t;};
const TINTS={glass:['#c9dcea','#b7d0d8','#d6dde6','#a9c3d6','#c8d2c4'],office:['#ffffff','#efe6d6','#e2e6ea','#f2e0c8'],
  brick:['#ffffff','#e8c8b0','#d8b8a8','#f0d8c0'],concrete:['#ffffff','#e0dcd2','#d4d8dc','#e8e0cc'],warehouse:['#ffffff','#d8e0e8','#e8dcc8','#c8d8c8'],
  house:['#f4e8d0','#e8f0e0','#f8dcd0','#d8e4f0','#f0f0e8','#efe0b8']};
function addB(x,y,w,h,dist){
  for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)set(xx,yy,BLD);
  let H,style;const area=w*h;
  if(dist==='downtown'){H=rnd(180,380)+Math.min(area,40)/40*rnd(60,320);style=pick(['glass','glass','office','concrete']);}
  else if(dist==='industrial'){H=rnd(45,75);style='warehouse';}
  else{H=rnd(55,120)+Math.min(area,40)/40*rnd(0,150);style=pick(['office','brick','brick','concrete']);}
  buildings.push({x:x*T,y:y*T,w:w*T,h:h*T,H:Math.round(H),style,tint:pick(TINTS[style]),dist,seed:Math.random()});
}
function split(x,y,w,h,d,dist){
  const maxD=dist==='downtown'?2:3,minA=dist==='downtown'?30:16;
  if(d>=maxD||w*h<=minA||(d>0&&Math.random()<0.3)){addB(x,y,w,h,dist);return;}
  if(w>=h&&w>=5){const c=ri(2,w-3);split(x,y,c,h,d+1,dist);for(let yy=y;yy<y+h;yy++)set(x+c,yy,WALK);split(x+c+1,y,w-c-1,h,d+1,dist);}
  else if(h>=5){const c=ri(2,h-3);split(x,y,w,c,d+1,dist);for(let xx=x;xx<x+w;xx++)set(xx,y+c,WALK);split(x,y+c+1,w,h-c-1,d+1,dist);}
  else addB(x,y,w,h,dist);
}
const GARAGE_B=[2,7],HOSP_B=[3,5],POLICE_B=[6,2],PLAZA_B=[6,6],CHURCH_B=[2,3],GAS_B=[7,4];
function genMap(){
  const colRoad=new Int8Array(MT).fill(-1),rowRoad=new Int8Array(MT).fill(-1);
  RX.forEach((r,i)=>{for(let k=0;k<WX[i];k++)colRoad[r+k]=i;});RY.forEach((r,j)=>{for(let k=0;k<WY[j];k++)rowRoad[r+k]=j;});
  const gx0=RX[0],gx1=AX.end,gy0=RY[0],gy1=AY.end;
  for(let y=0;y<MT;y++)for(let x=0;x<MT;x++){let t;
    if(x<gx0||x>=gx1||y<gy0||y>=gy1)t=(x>=gx1+MARGIN-1||y>=gy1+MARGIN-1)?WATER:SAND;
    else if(colRoad[x]>=0||rowRoad[y]>=0)t=ROAD;else t=GRASS;
    map[y*MT+x]=t;}
  const cxb=(NBX-1)/2,cyb=(NBY-1)/2;
  for(let bj=0;bj<NBY;bj++)for(let bi=0;bi<NBX;bi++){
    const x0=RX[bi]+WX[bi],x1=RX[bi+1]-1,y0=RY[bj]+WY[bj],y1=RY[bj+1]-1;
    for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){inBlock[y*MT+x]=1;if(x===x0||x===x1||y===y0||y===y1)set(x,y,WALK);}
    let dist;
    if(bi>=NBX-3&&bj>=NBY-3)dist='industrial';
    else if(Math.abs(bi-cxb)<=2.1&&Math.abs(bj-cyb)<=2.1)dist='downtown';
    else if(bi===0||bj===0||bi===NBX-1||bj===NBY-1)dist='residential';
    else dist='midtown';
    let type=dist;const r=Math.random();
    const is=(B)=>bi===B[0]&&bj===B[1];
    if(is(GARAGE_B))type='garage';else if(is(PLAZA_B))type='plaza';else if(is(CHURCH_B))type='church';else if(is(GAS_B))type='gas';
    else if(is(HOSP_B)||is(POLICE_B))type='midtown';
    else if(dist!=='downtown'&&dist!=='industrial'&&r<0.06)type='park';
    else if(dist!=='residential'&&r<0.1)type='lot';
    else if(dist==='residential'&&r<0.38)type='midtown';
    const ix0=x0+1,ix1=x1-1,iy0=y0+1,iy1=y1-1,iw=ix1-ix0+1,ih=iy1-iy0+1;
    blocks.push({bi,bj,x0,x1,y0,y1,dist,type});
    if(type==='downtown'||type==='midtown')split(ix0,iy0,iw,ih,0,type);
    else if(type==='industrial'){
      for(let y=iy0;y<=iy1;y++)for(let x=ix0;x<=ix1;x++)set(x,y,LOT);
      if(iw>=8&&Math.random()<0.6){const c=Math.floor(iw/2);addB(ix0+1,iy0+1,c-2,ih-2,'industrial');addB(ix0+c+1,iy0+1,iw-c-2,ih-2,'industrial');}
      else addB(ix0+1,iy0+1,iw-2,ih-2,'industrial');
      for(let k=0;k<3;k++)parkedSpots.push({x:(ix0+0.5)*T,y:(iy0+1.5+k*2)*T,a:Math.PI/2,type:'truck'});
    }else if(type==='residential'){
      for(let y=iy0;y<=iy1;y++)for(let x=ix0;x<=ix1;x++)set(x,y,GRASS);
      for(let py=iy0;py+2<=iy1;py+=4)for(let px=ix0;px+2<=ix1;px+=4){
        if(Math.random()<0.12)continue;
        const hx=px+1>ix1-1?px:px+(Math.random()<0.5?0:1),hy=py+1>iy1-1?py:py+(Math.random()<0.5?0:1);
        if(hx+1>ix1||hy+1>iy1)continue;
        for(let yy=hy;yy<hy+2;yy++)for(let xx=hx;xx<hx+2;xx++)set(xx,yy,BLD);
        houses.push({x:hx*T,y:hy*T,w:2*T,h:2*T,H:rnd(28,38),tint:pick(TINTS.house),roof:pick(['#8a3b2e','#6b4a3a','#4a4f5a','#7a2f2f','#5a5f4a'])});
        const dx=hx+2<=ix1?hx+2:hx-1;if(dx>=ix0&&dx<=ix1&&map[hy*MT+dx]===GRASS){set(dx,hy,LOT);if(Math.random()<0.3)parkedSpots.push({x:(dx+0.5)*T,y:(hy+0.5)*T+6,a:Math.PI/2});}
      }
      for(let k=0;k<iw*ih/6;k++){const tx=ri(ix0,ix1),ty=ri(iy0,iy1);if(map[ty*MT+tx]===GRASS)trees.push({x:tx*T+rnd(10,38),y:ty*T+rnd(10,38),r:rnd(11,18),k:0});}
    }else if(type==='park'){
      for(let y=iy0;y<=iy1;y++)for(let x=ix0;x<=ix1;x++)set(x,y,GRASS);
      const my=Math.floor((iy0+iy1)/2),mx=Math.floor((ix0+ix1)/2);
      for(let x=ix0;x<=ix1;x++)set(x,my,WALK);for(let y=iy0;y<=iy1;y++)set(mx,y,WALK);
      if(Math.random()<0.7){const px=ix0+1,py=iy0+1,pw=Math.min(3,mx-px),ph=Math.min(3,my-py);for(let y=py;y<py+ph;y++)for(let x=px;x<px+pw;x++)set(x,y,WATER);}
      for(let k=0;k<iw*ih/3;k++){const tx=ri(ix0,ix1),ty=ri(iy0,iy1);if(map[ty*MT+tx]===GRASS)trees.push({x:tx*T+rnd(8,40),y:ty*T+rnd(8,40),r:rnd(13,24),k:0});}
    }else if(type==='church'){
      for(let y=iy0;y<=iy1;y++)for(let x=ix0;x<=ix1;x++)set(x,y,WALK);
      const mx=Math.floor((ix0+ix1)/2),nx0=mx-1,nx1=mx+2,ty0=iy0+1,ny0=iy0+3,ny1=Math.min(iy1,iy0+10);
      for(let y=ny0;y<ny1;y++)for(let x=nx0;x<nx1;x++)set(x,y,BLD);for(let y=ty0;y<ty0+2;y++)for(let x=mx;x<mx+2;x++)set(x,y,BLD);
      church={nx0,nx1,ny0,ny1,tx0:mx,ty0};
      for(let k=0;k<10;k++){const tx=ri(ix0,ix1),ty=ri(iy0,iy1);if(map[ty*MT+tx]===WALK&&(tx<nx0-1||tx>nx1))trees.push({x:tx*T+24,y:ty*T+24,r:rnd(12,16),k:0});}
    }else if(type==='gas'){
      for(let y=iy0;y<=iy1;y++)for(let x=ix0;x<=ix1;x++)set(x,y,LOT);
      const sx0=ix1-2,sy0=iy0;for(let y=sy0;y<sy0+2;y++)for(let x=sx0;x<sx0+3;x++)set(x,y,BLD);
      gas={sx0,sy0,sw:3,sh:2,cx0:ix0+1,cy0:iy0+3,cw:Math.min(5,iw-2),ch:3};
    }else if(type==='plaza'){
      for(let y=iy0;y<=iy1;y++)for(let x=ix0;x<=ix1;x++)set(x,y,WALK);
      const mx=Math.floor((ix0+ix1)/2),my=Math.floor((iy0+iy1)/2);for(let y=my;y<my+2;y++)for(let x=mx;x<mx+2;x++)set(x,y,WATER);
      plaza={x:(mx+1)*T,y:(my+1)*T};
      for(let k=0;k<10;k++){const a=k/10*TAU;trees.push({x:(mx+1)*T+Math.cos(a)*T*3.2,y:(my+1)*T+Math.sin(a)*T*3.2,r:14,k:0});}
    }else{
      for(let y=iy0;y<=iy1;y++)for(let x=ix0;x<=ix1;x++)set(x,y,LOT);
      if(type==='lot')lots.push({ix0,ix1,iy0,iy1});
    }
    if(dist!=='downtown'&&dist!=='industrial'){
      for(let x=x0+2;x<x1;x+=6){trees.push({x:(x+0.5)*T,y:(y0+0.5)*T,r:rnd(11,15),k:0});trees.push({x:(x+0.5)*T,y:(y1+0.5)*T,r:rnd(11,15),k:0});}
    }
  }
  for(let k=0;k<70;k++){const side=ri(0,3);let x,y;const L=Math.max(gx1,gy1);
    if(side===0){x=rnd(1,MARGIN-1);y=rnd(1,gy1+MARGIN-2);}else if(side===1){x=rnd(gx1+1,gx1+MARGIN-2);y=rnd(1,gy1+MARGIN-2);}
    else if(side===2){y=rnd(1,MARGIN-1);x=rnd(1,gx1+MARGIN-2);}else{y=rnd(gy1+1,gy1+MARGIN-2);x=rnd(1,gx1+MARGIN-2);}
    if(tile(Math.floor(x),Math.floor(y))===SAND)trees.push({x:x*T,y:y*T,r:rnd(14,20),k:1});}
  {const qx=gx1,y0=RY[NBY-3];for(let y=y0;y<gy1;y++)for(let x=qx;x<qx+MARGIN-1;x++)if(map[y*MT+x]===SAND)set(x,y,LOT);
   for(let y=y0+1;y+1<gy1;y+=3){if(Math.random()<0.15)continue;for(const cx of [qx+1,qx+2]){set(cx,y,BLD);set(cx,y+1,BLD);containers.push({x:cx*T,y:y*T,w:T,h:2*T,n:ri(1,3)});}}
   for(let y=y0+4;y<gy1-2;y+=9)cranes.push({x:(qx+3)*T+T/2,y:(y+0.5)*T});}
  for(let y=1;y<3;y++)for(let x=1;x<3;x++)set(x,y,BLD);lighthouse={x:2*T,y:2*T};
  {const fx=Math.floor((RX[4]+RX[5])/2),fy=gy1+1;for(let x=fx-1;x<=fx+1;x++)set(x,fy,BLD);ferris={x:(fx+0.5)*T,y:(fy+0.5)*T};}
  {const big=buildings.filter(b=>b.dist==='downtown').sort((a,b)=>b.w*b.h-a.w*a.h)[0];if(big){big.H=Math.max(big.H,860);big.style='glass';big.tint='#b7d0d8';big.landmark=true;}}
}
let plaza=null,church=null,gas=null,lighthouse=null,ferris=null;const containers=[],cranes=[];
genMap();
Math.random=_rand;
const blockAt=(bi,bj)=>blocks[bj*NBX+bi];
function sideMid(bi,bj){const b=blockAt(bi,bj);return {x:(b.x0+0.5)*T,y:(Math.floor((b.y0+b.y1)/2)+0.5)*T};}
const hospPos=sideMid(...HOSP_B), policePos=sideMid(...POLICE_B);
const garage=(()=>{const b=blockAt(...GARAGE_B);return {x:(b.x0+b.x1+1)/2*T,y:(b.y0+b.y1+1)/2*T};})();

const mm=document.createElement('canvas');mm.width=MT;mm.height=MT;
(function(){const m=mm.getContext('2d'),img=m.createImageData(MT,MT);
  const C={0:[62,118,58],1:[58,58,64],2:[140,136,128],3:[110,104,120],4:[30,74,115],5:[80,80,86],6:[214,196,140]};
  for(let i=0;i<MT*MT;i++){const c=C[map[i]];img.data[i*4]=c[0];img.data[i*4+1]=c[1];img.data[i*4+2]=c[2];img.data[i*4+3]=255;}
  m.putImageData(img,0,0);})();

// =====================================================================
//  AUDIO (synthétisé)
// =====================================================================
let AC=null,master=null,noiseBuf=null,engOsc,engOsc2,engGain,engFilt,sirOsc,sirGain,scrGain,muted=false;
function initAudio(){
  if(AC)return;
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;return;}
  master=AC.createGain();master.gain.value=0.35;master.connect(AC.destination);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*1.5,AC.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  engOsc=AC.createOscillator();engOsc.type='sawtooth';engOsc2=AC.createOscillator();engOsc2.type='square';
  engFilt=AC.createBiquadFilter();engFilt.type='lowpass';engFilt.frequency.value=400;
  engGain=AC.createGain();engGain.gain.value=0;const g2=AC.createGain();g2.gain.value=0.4;
  engOsc.connect(engFilt);engOsc2.connect(g2);g2.connect(engFilt);engFilt.connect(engGain);engGain.connect(master);engOsc.start();engOsc2.start();
  sirOsc=AC.createOscillator();sirOsc.type='square';const sf=AC.createBiquadFilter();sf.type='lowpass';sf.frequency.value=1600;
  sirGain=AC.createGain();sirGain.gain.value=0;sirOsc.connect(sf);sf.connect(sirGain);sirGain.connect(master);sirOsc.start();
  const sn=AC.createBufferSource();sn.buffer=noiseBuf;sn.loop=true;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1700;bp.Q.value=3;
  scrGain=AC.createGain();scrGain.gain.value=0;sn.connect(bp);bp.connect(scrGain);scrGain.connect(master);sn.start();
}
function noise(dur,freq,vol){
  if(!AC||muted||vol<0.01)return;const t=AC.currentTime;
  const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=freq;
  const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random()*Math.max(0,1.45-dur));s.stop(t+dur+0.05);
}
function tone(freq,dur,vol,type='square',delay=0){
  if(!AC||muted||vol<0.01)return;const t=AC.currentTime+delay;
  const o=AC.createOscillator();o.type=type;o.frequency.value=freq;const g=AC.createGain();
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.05);
}

  rifle:(x,y)=>noise(0.12,2600,0.55*volAt(x,y)),
  shotgun:(x,y)=>noise(0.35,1500,0.9*volAt(x,y)),

  crash:(x,y,k)=>noise(0.22,700,clamp(k,0,1)*0.7*volAt(x,y)),

function onPress(code){
  if(!started){if(code==='Enter'||code==='Space'){started=true;initAudio();lockMouse();camYaw=player.a;}return;}
  if(code==='KeyO'){toggleMature();return;}
  if(mapOpen&&(code==='Escape'||code==='KeyC')){mapOpen=false;lockMouse();return;}
  if(code==='KeyP'||code==='Escape'){if(paused&&code==='KeyP'){paused=false;lockMouse();}else{paused=true;mouse.down=false;unlockMouse();}return;}
  if(paused)return;
  if(code==='KeyE'||code==='KeyF'){if(!interact())toggleCar();}
  if(code==='KeyR'&&player.car){radio=(radio+1)%STATIONS.length;note(radio?'Radio : '+STATIONS[radio].name:'Radio coupée');}
  const dg=/^Digit([1-7])$/.exec(code);if(dg)setWeapon(+dg[1]-1);
  if(code==='KeyM'){muted=!muted;note(muted?'Son coupé':'Son activé');}
  if(code==='KeyG')toggleQuality();
  if(code==='KeyV'){fpsMode=!fpsMode;camSnap=true;note(fpsMode?'Vue : première personne':'Vue : troisième personne');}
  if(code==='KeyH'&&player.car)SFX.horn(player.x,player.y);
  if(code==='KeyQ'||code==='Tab')cycleWeapon(1);
  if(code==='KeyT'){openChat();return;}
  if(code==='KeyC'){mapOpen=true;mouse.down=false;unlockMouse();return;}
  if(code==='Space'&&!lap&&!player.car&&player.alive&&!player.swim&&player.z<=0.01){player.vz=lune?280:165;SFX.jump();}
}

function shoot(owner,x,y,ang,wp){
  const ownCar=owner==='player'?player.car:null;
  const gz=(owner==='player'?(player.car?18:14+player.z):14)+groundH(x,y);
  for(let k=0;k<wp.pellets;k++)hitscan(owner,ownCar,x+Math.cos(ang)*14,y+Math.sin(ang)*14,ang+rnd(-wp.spread,wp.spread),wp.range*rnd(0.85,1),wp.dmg,gz);

  addPart(x+Math.cos(ang)*18,y+Math.sin(ang)*18,0,0,0.05,'#ffe08a',4,0,0,gz,0,false,true);
  flashT=0.05;flashX=x+Math.cos(ang)*18;flashY=y+Math.sin(ang)*18;flashZ=gz;
  scare(x,y,420);

}

function hitscan(owner,ownCar,x,y,a,range,dmg,gz){
  const dx=Math.cos(a),dy=Math.sin(a),ex=x+dx*range,ey=y+dy*range;
  const minX=Math.min(x,ex)-40,maxX=Math.max(x,ex)+40,minY=Math.min(y,ey)-40,maxY=Math.max(y,ey)+40;
  const pc=peds.filter(p=>p.state!=='dead'&&p!==owner&&p.x>minX&&p.x<maxX&&p.y>minY&&p.y<maxY);
  const cc=cars.filter(c=>c!==ownCar&&c.x>minX&&c.x<maxX&&c.y>minY&&c.y<maxY);
  let px=x,py=y,dist=0;const step=5;const src=owner==='player'?'player':'npc';
  outer: while(dist<range){
    px+=dx*step;py+=dy*step;dist+=step;
    if(wallAt(px,py)){sparks(px-dx*4,py-dy*4,4,gz);break;}
    if(src==='player'&&remoteHitAt(px,py,dmg))break;
    for(const p of pc){if((p.x-px)**2+(p.y-py)**2<100&&p.state!=='dead'){hurtPed(p,dmg,src,a);break outer;}}
    for(const c of cc){if(pointInCar(c,px,py)){damageCar(c,dmg*0.4,src);sparks(px,py,4,12);
      if(c===player.car&&src!=='player')hurtPlayer(dmg*0.3);break outer;}}
    if(src!=='player'&&!player.car&&player.alive&&player.z<20&&(player.x-px)**2+(player.y-py)**2<110){hurtPlayer(dmg);bleed(px,py,a,4);break;}
  }
  if(tracers.length<150)tracers.push({x1:x,y1:y,x2:px,y2:py,z:gz,t:0.06});
}
function melee(wp){
  const a=player.bodyA,cx=player.x+Math.cos(a)*14,cy=player.y+Math.sin(a)*14;let hit=false;
  if(remoteHitAt(cx,cy,wp.dmg)){SFX.punch(cx,cy);return;}
  for(const p of peds){if(p.state==='dead')continue;if(hyp(p.x-cx,p.y-cy)<wp.range){hurtPed(p,wp.dmg,'player',a);
    const nx=p.x+Math.cos(a)*10,ny=p.y+Math.sin(a)*10;if(!solidCircle(nx,ny,6)){p.x=nx;p.y=ny;}hit=true;break;}}
  if(!hit)for(const c of cars){if(pointInCar(c,cx,cy)){damageCar(c,wp.dmg*0.15,'player');hit=true;break;}}
  if(hit)SFX.punch(cx,cy);else SFX.swing();
  if(hit&&wanted===0&&copSees(300))crime(0.6);
}
function fireRocket(){
  const a=player.a,x=player.x+Math.cos(a)*18,y=player.y+Math.sin(a)*18;
  rockets.push({x,y,z:(player.car?18:15+player.z)+groundH(x,y),vx:Math.cos(a)*640,vy:Math.sin(a)*640,t:2.6,ownCar:player.car});
  SFX.rocket(x,y);scare(x,y,420);if(wanted===0&&copSees(420))crime(1);
}
function updateRockets(dt){
  for(let i=rockets.length-1;i>=0;i--){const r=rockets[i];let boom=false;r.t-=dt;
    for(let s=0;s<3&&!boom;s++){r.x+=r.vx*dt/3;r.y+=r.vy*dt/3;
      if(solidAt(r.x,r.y))boom=true;
      for(const p of peds)if(p.state!=='dead'&&hyp(p.x-r.x,p.y-r.y)<12){boom=true;break;}
      for(const c of cars)if(c!==r.ownCar&&pointInCar(c,r.x,r.y)){boom=true;break;}}
    addPart(r.x,r.y,rnd(-10,10),rnd(-10,10),rnd(0.6,1.1),'#cfcfcf',rnd(3,5),9,1,r.z,10);
    addPart(r.x,r.y,0,0,0.08,'#ffb040',4,0,0,r.z,0,false,true);
    if(boom||r.t<=0){explosion(r.x-r.vx*0.01,r.y-r.vy*0.01,'player');rockets.splice(i,1);}
  }
}

function carHitsWall(c,x,y,a){const ca=Math.cos(a),sa=Math.sin(a),hl=c.l/2-1,hw=c.w/2-1;
  for(let fl=-1;fl<=1;fl++)for(let fw=-1;fw<=1;fw+=2){const px=x+ca*hl*fl-sa*hw*fw,py=y+sa*hl*fl+ca*hw*fw;if(OOB(px,py)||(c.type==='boat'?tileAt(px,py)!==WATER:wallAt(px,py)))return true;}return false;}
function tryMove(c,dx,dy){if(!carHitsWall(c,c.x+dx,c.y+dy,c.a)){c.x+=dx;c.y+=dy;}}
function carPhysics(c,thr,st,hb,dt){
  if(c.hp<=0){thr=0;st=0;hb=true;}
  const rate=(st===0||Math.sign(st)!==Math.sign(c.ss))?7:3.4;c.ss+=clamp(st-c.ss,-rate*dt,rate*dt);
  const ca=Math.cos(c.a),sa=Math.sin(c.a);
  const f0=c.vx*ca+c.vy*sa,sp=Math.abs(f0);
  c.braking=false;
  if(thr>0){if(c.v<-5){c.v+=900*dt;c.braking=true;}else c.v+=c.acc*thr*(1-0.72*clamp(c.v/c.maxV,0,1)**2)*dt;}
  else if(thr<0){if(c.v>5){c.v-=900*dt;c.braking=true;}else c.v-=c.acc*0.55*dt;}
  else{const dr=(90+0.0008*c.v*c.v)*dt;c.v=Math.abs(c.v)<dr?0:c.v-Math.sign(c.v)*dr;}
  if(hb){const dr=320*dt;c.v=Math.abs(c.v)<dr?0:c.v-Math.sign(c.v)*dr;c.braking=true;}
  c.v=clamp(c.v,-c.maxV*0.35,c.maxV);
  const sf=clamp(sp/75,0,1)*(1-0.5*clamp(sp/c.maxV,0,1));
  const oa=c.a;c.a+=c.ss*c.turn*sf*(f0<0?-1:1)*(hb?1.6:1)*dt;
  if(carHitsWall(c,c.x,c.y,c.a))c.a=oa;
  const na=Math.cos(c.a),nb=Math.sin(c.a);
  let f=c.vx*na+c.vy*nb,l=-c.vx*nb+c.vy*na;
  if(hb){f+=(c.v-f)*(1-Math.exp(-1.6*dt));c.v=f;}else f=c.v;
  const slide=Math.abs(l);
  const grip=(c.type==='boat'?0.4:1)*(hb?1.1:(slide>160?2.4:(slide>95?4.8:10)));

function carCollisions(){

    }}
}

function validDirs(i,j){return [0,1,2,3].filter(d=>{const ni=i+DIRS[d][0],nj=j+DIRS[d][1];return ni>=0&&nj>=0&&ni<=NX&&nj<=NY;});}

function trafficAI(c,dt){

const flow=new Int16Array(MT*MT),fq=new Int32Array(MT*MT);let flowTimer=0;flow.fill(-1);
function buildFlow(){
  flow.fill(-1);const sx=clamp(Math.floor(player.x/T),0,MT-1),sy=clamp(Math.floor(player.y/T),0,MT-1);
  let h=0,t=0;const s=sy*MT+sx;flow[s]=0;fq[t++]=s;
  while(h<t){const i=fq[h++],v=flow[i]+1,x=i%MT;if(v>120)continue;
    if(x>0&&flow[i-1]<0&&!solidT(map[i-1])){flow[i-1]=v;fq[t++]=i-1;}
    if(x<MT-1&&flow[i+1]<0&&!solidT(map[i+1])){flow[i+1]=v;fq[t++]=i+1;}
    if(i>=MT&&flow[i-MT]<0&&!solidT(map[i-MT])){flow[i-MT]=v;fq[t++]=i-MT;}
    if(i<MT*MT-MT&&flow[i+MT]<0&&!solidT(map[i+MT])){flow[i+MT]=v;fq[t++]=i+MT;}}
}
function flowTarget(x,y,steps){
  let tx=Math.floor(x/T),ty=Math.floor(y/T);
  if(tx<0||ty<0||tx>=MT||ty>=MT)return {x:player.x,y:player.y};
  let cur=flow[ty*MT+tx];if(cur<0)return {x:player.x,y:player.y};
  for(let s=0;s<steps;s++){let bx=tx,by=ty,best=cur;
    for(const [dx,dy] of DIRS){const nx=tx+dx,ny=ty+dy;if(nx<0||ny<0||nx>=MT||ny>=MT)continue;const v=flow[ny*MT+nx];if(v>=0&&v<best){best=v;bx=nx;by=ny;}}
    if(best===cur)break;tx=bx;ty=by;cur=best;}
  if(cur===0)return {x:player.x,y:player.y};
  return {x:tx*T+T/2,y:ty*T+T/2};
}
function lineOfSight(x0,y0,x1,y1){const d=hyp(x1-x0,y1-y0),n=Math.ceil(d/16);
  for(let i=1;i<n;i++){if(wallAt(x0+(x1-x0)*i/n,y0+(y1-y0)*i/n))return false;}return true;}

    const opts=D4.filter(a=>{const t=tileAt(p.x+Math.cos(a)*14,p.y+Math.sin(a)*14);return pedWalkable(t)||(cur===ROAD&&!solidT(t));});
    p.dir=opts.length?pick(opts):p.dir+Math.PI;}
  movePed(p,p.dir,p.spd,dt);
}

function hurtPlayer(d){
  if(god)return;
  if(!player.alive)return;
  if(player.armor>0){const a=Math.min(player.armor,d*0.7);player.armor-=a;d-=a;}
  player.hp-=d;player.hurtT=0.35;SFX.hurt();
  if(player.hp<=0){player.hp=0;playerDown('dead');}
}
function nearestCar(){let best=null,bd=62;
  for(const c of cars){if(c.dead||c.hp<=0||c.remote)continue;const d=hyp(c.x-player.x,c.y-player.y);if(d<bd){bd=d;best=c;}}return best;}
function toggleCar(){
  if(!player.alive)return;
  if(player.car){const c=player.car,ca=Math.cos(c.a),sa=Math.sin(c.a);let placed=false;
    for(const s of [1,-1]){const x=c.x+sa*(c.w/2+12)*s,y=c.y-ca*(c.w/2+12)*s;if(!pBlocked(x,y,7)){player.x=x;player.y=y;placed=true;break;}}
    if(!placed){player.x=c.x-ca*(c.l/2+12);player.y=c.y-sa*(c.l/2+12);}
    const sp=hyp(c.vx,c.vy);if(sp>160)hurtPlayer(sp*0.05);
    player.bodyA=c.a;c.driver=null;player.car=null;player.z=0;player.vz=0;return;}
  const best=nearestCar();
  if(!best)return;
  if(best.driver==='ai'||best.driver==='cop'){const cop=best.driver==='cop';ejectDriver(best);if(cop)crime(2.5);else if(copSees(380))crime(1);}
  best.driver='player';best.chaser=false;best.siren=false;best.traffic=false;best.copsOut=false;best.ai=null;
  if(best.type==='police')best.maxV=CT.police.maxV+60;
  player.car=best;note(CT[best.type].name);
}
function updatePlayer(dt){
  player.hurtT-=dt;player.cool-=dt;player.aimT-=dt;player.punchT-=dt;
  if(!player.alive)return;
  if(lap){updateLap(dt);return;}
  if(br){updateBackroom(dt);return;}
  const up=keys.KeyW||keys.ArrowUp,dn=keys.KeyS||keys.ArrowDown,lf=keys.KeyA||keys.ArrowLeft,rt=keys.KeyD||keys.ArrowRight;
  const wp=WEAP[player.w];
  if(player.car&&player.car.air){player.x=player.car.x;player.y=player.car.y;player.a=camYaw;return;}
  if(player.car){const c=player.car;
    if(turbo){c.maxV=CT[c.type].maxV*1.7;c.acc=CT[c.type].acc*1.8;c.turboed=true;}else if(c.turboed){c.maxV=CT[c.type].maxV;c.acc=CT[c.type].acc;c.turboed=false;}
    carPhysics(c,up?1:dn?-1:0,clamp((lf?-1:rt?1:0)+(player.drunk>0.3?Math.sin(time*1.4)*0.55*Math.min(1.2,player.drunk):0),-1,1),!!keys.Space,dt);
    player.x=c.x;player.y=c.y;player.a=camYaw;
  }else{
    const aiming=(mouse.right&&!wp.melee)||player.aimT>0;
    const f=(up?1:0)-(dn?1:0),s=(rt?1:0)-(lf?1:0);
    const run=(keys.ShiftLeft||keys.ShiftRight)&&!aiming;
    player.swim=!player.inside&&tileAt(player.x,player.y)===WATER;const sp=player.swim?(run?70:55):run?150:(aiming?65:85);
    player.moving=false;player.a=camYaw;
    if(f||s){const l=hyp(f,s),fx=Math.cos(camYaw),fy=Math.sin(camYaw);
      let dx=(fx*f-fy*s)/l,dy=(fy*f+fx*s)/l;if(player.drunk>0.3){const da=Math.sin(time*0.9)*0.6*Math.min(1.3,player.drunk-0.3),c2=Math.cos(da),s2=Math.sin(da);const ndx=dx*c2-dy*s2;dy=dx*s2+dy*c2;dx=ndx;}
      const nx=player.x+dx*sp*dt,ny=player.y+dy*sp*dt;
      const stuck=pBlocked(player.x,player.y,8);if(stuck||!pBlocked(nx,player.y,8))player.x=nx;if(stuck||!pBlocked(player.x,ny,8))player.y=ny;player.moving=true;player.runS=sp;player.anim+=dt*sp/40;
      if(!aiming)player.bodyA+=angDiff(player.bodyA,Math.atan2(dy,dx))*(1-Math.exp(-12*dt));}
    if(aiming||player.punchT>0)player.bodyA+=angDiff(player.bodyA,camYaw)*(1-Math.exp(-25*dt));
    if(fpsMode)player.bodyA=camYaw;
    player.vz-=(lune?170:600)*dt;player.z+=player.vz*dt;if(player.z<=0){player.z=0;player.vz=0;}
  }
  mouse.wx=player.x+Math.cos(camYaw)*400;mouse.wy=player.y+Math.sin(camYaw)*400;
  const noArms=player.inside&&player.inside.id==='club';
  if(noArms&&mouse.down&&!mouse.shot&&player.cool<=0){mouse.shot=true;player.cool=1;note('Armes interdites au Velvet — le videur veille');}
  if(!noArms&&mouse.down&&player.cool<=0&&!player.swim&&(wp.auto||!mouse.shot)){
    if(wp.melee){if(!player.car){player.bodyA=camYaw;player.punchT=0.28;player.cool=wp.rate;melee(wp);}}
    else if(player.ammo[player.w]>0){
      if(!player.car)player.bodyA=camYaw;player.aimT=1.2;
      if(MOBILE&&!player.car)player.a=aimAssist(player.a);
      if(wp.rocket)fireRocket();else shoot('player',player.x,player.y,player.a,wp);
      player.cool=wp.rate;player.ammo[player.w]--;mouse.shot=true;
      if(player.ammo[player.w]<=0){note(wp.name+' vide');cycleWeapon(-1);}
    }
  }
  if(wanted>0){let near=false;
    for(const p of peds){if(p.kind==='cop'&&p.state!=='dead'&&hyp(p.x-player.x,p.y-player.y)<(player.car?40:24)){near=true;break;}}
    const slow=!player.car||hyp(player.car.vx,player.car.vy)<20;
    if(near&&slow)player.bustT+=dt;else player.bustT=Math.max(0,player.bustT-dt*2);
    if(player.bustT>2.4)playerDown('busted');
  }else player.bustT=0;
  garageCool-=dt;
  if(player.car&&garageCool<=0&&hyp(player.x-garage.x,player.y-garage.y)<55&&hyp(player.car.vx,player.car.vy)<90){
    garageCool=6;const c=player.car;
    if(wanted===0&&c.hp>=c.maxHp)note('Carrosserie : rien à réparer');
    else if(player.money<250)note('Carrosserie : il te faut $250');
    else{player.money-=250;c.col=pick(CT[c.type].cols.length>1?CT[c.type].cols:CT.civ.cols);c.hp=c.maxHp;c.fire=0;
      heat=0;wanted=0;bigMsg('CARROSSERIE','Véhicule réparé et repeint — police semée','#5fd3ff');SFX.cash();}
  }
}
let garageCool=0;
let deadT=0,deadKind='';
function playerDown(kind){

  if(player.car){player.car.driver=null;if(kind==='busted'){player.car.v=0;}player.car=null;}

let heat=0,wanted=0,unseen=0,seenT=0,seen=false;
const STAR=[1,4,8,14,22];
function crime(p){if(!player.alive)return;heat=Math.min(30,heat+p);unseen=0;const w=starsFor(heat);if(w>wanted){wanted=w;}}
function starsFor(h){let w=0;for(const s of STAR)if(h>=s)w++;return w;}
function copSees(r){
  for(const p of peds){if(p.kind!=='cop'||p.state==='dead')continue;const d=hyp(p.x-player.x,p.y-player.y);if(d<r&&lineOfSight(p.x,p.y,player.x,player.y))return true;}
  for(const c of cars){if(c.driver!=='cop'||c.hp<=0)continue;const d=hyp(c.x-player.x,c.y-player.y);if(d<r&&lineOfSight(c.x,c.y,player.x,player.y))return true;}
  return false;}
function updateWanted(dt){
  if(wanted===0){heat=0;unseen=0;return;}
  seenT-=dt;if(seenT<=0){seenT=0.25;seen=copSees(420);}
  if(seen)unseen=0;else unseen+=dt;
  if(unseen>3+wanted*0.8){heat=Math.max(0,heat-dt*1.5);const w=starsFor(heat);
    if(w<wanted){wanted=w;if(w===0){note('Tu as semé la police');heat=0;}}}
}

function offscreen(x,y,m){const dx=x-camPos.x,dy=y-camPos.z,d=hyp(dx,dy);if(d>1400+m)return true;if(d<140)return false;
  return (dx*Math.cos(camYaw)+dy*Math.sin(camYaw))/d<-0.15;}
function randomRoadSpot(minD,maxD,needOff=true){
  for(let k=0;k<35;k++){const i=ri(0,NX),j=ri(0,NY),vd=validDirs(i,j),d=pick(vd),[dx,dy]=DIRS[d];
    const ni=i+dx,nj=j+dy,L=hyp(icx(ni)-icx(i),icy(nj)-icy(j)),t=rnd(0.3,0.7)*L,lane=Math.random()<0.5?0:1;

    const x=icx(i)+dx*t-dy*lo,y=icy(j)+dy*t+dx*lo,dd=hyp(x-player.x,y-player.y);

function spawnTrafficCar(s){

let spawnT=0;
function manageSpawns(dt){

  peds=peds.filter(p=>{if(p.keep)return true;const d=hyp(p.x-player.x,p.y-player.y);

  const nT=cars.filter(c=>c.traffic&&c.hp>0&&c.driver&&!c.chaser).length;

  pickups.push({x:hospPos.x,y:hospPos.y-5*T,kind:'bat',temp:false,t:0,respawn:0,amt:0});

  for(let k=0;k<(MOBILE?18:34);k++){const s=randomWalkSpot(60,1100,false);if(s)peds.push(makePed(s.x,s.y,Math.random()<0.05?'cop':'civ'));}
}
const PICKW={bat:[1,Infinity,'Batte'],pistol:[2,24,'Pistolet'],uzi:[3,90,'Uzi'],shotgun:[4,16,'Fusil à pompe'],rifle:[5,90,'Fusil d\'assaut'],rocket:[6,4,'Lance-roquettes']};
function updatePickups(dt){
  for(let i=pickups.length-1;i>=0;i--){const p=pickups[i];
    if(p.respawn>0){p.respawn-=dt;continue;}
    if(p.temp){p.t-=dt;if(p.t<=0){pickups.splice(i,1);continue;}}
    if(!player.alive)continue;
    const d=hyp(p.x-player.x,p.y-player.y);if(d>(player.car?34:22))continue;
    if(player.car&&p.kind!=='cash')continue;
    let ok=true;
    if(PICKW[p.kind]){const [wi,am,nm]=PICKW[p.kind];const had=player.ammo[wi]>0;player.ammo[wi]=am===Infinity?Infinity:player.ammo[wi]+(p.amt||am);
      if(!had||player.w===0)player.w=wi;note(nm+(am===Infinity?'':' +'+(p.amt||am)));}
    else switch(p.kind){
      case 'health':if(player.hp>=100){ok=false;break;}player.hp=Math.min(100,player.hp+50);note('+ Santé');break;
      case 'armor':if(player.armor>=100){ok=false;break;}player.armor=100;note('+ Gilet pare-balles');break;
      case 'cash':{const a=p.amt||ri(150,450);player.money+=a;note('+$'+a);SFX.cash();break;}
    }
    if(!ok)continue;if(p.kind!=='cash')SFX.pick();
    if(p.temp)pickups.splice(i,1);else p.respawn=60;
  }
}

function endMissionCleanup(){if(mission&&mission.type==='contrat'){mission.target.keep=false;for(const g of mission.gang)g.keep=false;}mission=null;}
function missionSuccess(){const r=mission.reward;player.money+=r;bigMsg('MISSION RÉUSSIE','+$'+r,'#7CFC7C');SFX.win();endMissionCleanup();}
function missionFail(why){bigMsg('MISSION ÉCHOUÉE',why,'#ff5252');SFX.fail();endMissionCleanup();}
function updateMission(dt){
  for(const g of givers){const d=hyp(g.x-player.x,g.y-player.y);if(d>90)g.armed=true;
    if(!mission&&g.armed&&player.alive&&d<30){g.armed=false;startMission();}}
  if(!mission)return;
  mission.time-=dt;if(mission.time<=0){missionFail('Temps écoulé');return;}
  if(mission.type==='livraison'){if(player.car&&hyp(player.x-mission.dest.x,player.y-mission.dest.y)<70)missionSuccess();}
  else if(mission.type==='course'){const cp=mission.cps[mission.idx];
    if(player.car&&hyp(player.x-cp.x,player.y-cp.y)<80){mission.idx++;SFX.pick();
      if(mission.idx>=mission.cps.length){missionSuccess();return;}
      const n=mission.cps[mission.idx];mission.time+=hyp(n.x-cp.x,n.y-cp.y)/230+4;}}
  else if(mission.type==='contrat'){const t=mission.target;
    if(hyp(t.x-player.x,t.y-player.y)<420)for(const g of mission.gang)g.hostile=true;}
}
function missionTarget(){
  if(!mission)return taxiTarget();

function buildActivities(){
  const gx1=AX.end,gy1=AY.end,cand=[];
  for(let k=1;k<=4;k++){cand.push({x:(RX[0]+(gx1-RX[0])*k/5)*T,y:2.6*T,a:k%2?0:Math.PI});cand.push({x:(RX[0]+(gx1-RX[0])*k/5+3)*T,y:(gy1+2.4)*T,a:k%2?Math.PI:0});}
  for(let k=1;k<=3;k++)cand.push({x:2.6*T,y:(RY[0]+(gy1-RY[0])*k/4)*T,a:k%2?Math.PI/2:-Math.PI/2});
  lots.slice(0,5).forEach((L,k)=>cand.push({x:((L.ix0+L.ix1)/2+0.5)*T,y:((L.iy0+L.iy1)/2+0.5)*T,a:k*Math.PI/2}));
  const [rc,rg]=mkCanvas(128,64);for(let i=0;i<8;i++){rg.fillStyle=i%2?'#151515':'#f0c020';rg.beginPath();rg.moveTo(i*20-20,0);rg.lineTo(i*20,0);rg.lineTo(i*20-20,64);rg.lineTo(i*20-40,64);rg.fill();}
  const rmat=new THREE.MeshStandardMaterial({map:canvasTex(rc),roughness:0.6,metalness:0.2});
  const sh=new THREE.Shape();sh.moveTo(-30,0);sh.lineTo(30,0);sh.lineTo(30,15);sh.lineTo(-30,0);
  const rgeo=new THREE.ExtrudeGeometry(sh,{depth:34,bevelEnabled:false});rgeo.translate(0,0,-17);
  for(const r of cand){let ok=true;for(let k=-1;k<=1;k++)for(let j=-1;j<=1;j++)if(solidAt(r.x+k*30,r.y+j*18))ok=false;if(!ok)continue;
    r.i=ramps.length;r.h=groundH(r.x,r.y);const m=new THREE.Mesh(rgeo,rmat);m.position.set(r.x,r.h,r.y);m.rotation.y=-r.a;m.castShadow=true;m.receiveShadow=true;city.add(m);ramps.push(r);}
  let sd=777;const R=()=>{sd=(sd*16807)%2147483647;return sd/2147483647;};let tries=0;
  while(neonsC.length<40&&tries<30000){tries++;const tx=Math.floor(R()*MT),ty=Math.floor(R()*MT),t=map[ty*MT+tx];if(!(t===WALK||t===GRASS||t===SAND||t===LOT))continue;
    const x=(tx+0.5)*T,y=(ty+0.5)*T;if(neonsC.some(n=>hyp(n.x-x,n.y-y)<500))continue;neonsC.push({i:neonsC.length,x,y});}
  const ng=new THREE.TorusGeometry(5,1.2,10,28),nm=new THREE.MeshStandardMaterial({color:'#ff4fd8',emissive:'#ff4fd8',emissiveIntensity:2.6,roughness:0.3});

}
function updateActivities(dt){
  if(player.inside)return;
  for(const n of neonsC){if(!n.mesh)continue;n.mesh.rotation.y+=dt*2;n.mesh.position.y=groundH(n.x,n.y)+12+Math.sin(time*2+n.i)*2;
    if(hyp(n.x-player.x,n.y-player.y)<(player.car?30:20)){city.remove(n.mesh);n.mesh=null;neonFound.add(n.i);saveProgress();player.money+=250;SFX.cash();
      const k=neonFound.size;if(k>=neonsC.length){player.money+=25000;bigMsg('TOUS LES NÉONS !','+$25 000 — Port Néon n\'a plus de secrets pour toi','#ff4fd8',5);}else bigMsg('NÉON CACHÉ',k+' / '+neonsC.length+'  •  +$250','#ff4fd8',2.5);}}
  const c=player.car;
  if(c&&c.type!=='boat'){
    if(c.air){c.vz-=520*dt;c.jz+=c.vz*dt;c.airT+=dt;const nx=c.x+c.vx*dt,ny=c.y+c.vy*dt;if(!carHitsWall(c,nx,ny,c.a)){c.x=nx;c.y=ny;}else{c.vx*=-0.3;c.vy*=-0.3;}
      if(c.jz<=0){c.air=false;c.jz=0;const m=Math.round(hyp(c.x-c.jx,c.y-c.jy)/T*4);let gain=Math.round(m*8+c.airT*60);const r=c.jr;
        if(c.vz<-260){damageCar(c,(-c.vz-260)*0.08,null);shake(10);}else shake(5);SFX.crash(c.x,c.y,0.6);
        let extra='';if(r&&!rampsDone.has(r.i)&&m>=12){rampsDone.add(r.i);saveProgress();gain+=500;extra=' • SAUT UNIQUE '+rampsDone.size+'/'+ramps.length+' (+$500)';}
        player.money+=gain;bigMsg('SAUT ACROBATIQUE !',m+' m • '+c.airT.toFixed(1)+' s • +$'+gain+extra,'#ffd23f',3.2);}
    }else{let on=null;for(const r of ramps){const dx=c.x-r.x,dy=c.y-r.y,ca=Math.cos(r.a),sa=Math.sin(r.a),lx=dx*ca+dy*sa,ly=-dx*sa+dy*ca;if(Math.abs(ly)<19&&lx>-30&&lx<31){on={r,lx,ca,sa};break;}}
      if(on){const f=c.vx*on.ca+c.vy*on.sa;c.jz=Math.max(0,(on.lx+30)/60*15);
        if(on.lx>26&&f>170){c.air=true;c.vz=f*0.42+40;c.airT=0;c.jx=c.x;c.jy=c.y;c.jr=on.r;note('Envol !');}}
      else if(!c.dead)c.jz=0;}
  }
}
function taxiTarget(){if(!taxi)return null;if(taxi.stage==='pickup'&&taxi.ped)return {x:taxi.ped.x,y:taxi.ped.y,col:'#40c0ff'};if(taxi.stage==='drive')return {x:taxi.dest.x,y:taxi.dest.y,col:'#40c0ff'};return null;}

function updateTaxi(dt){
  const c=player.car;
  if(!c||c.type!=='taxi'||mission||player.inside){if(taxi){if(taxi.ped)taxi.ped.keep=false;bigMsg('JOB DE TAXI TERMINÉ','Gains : $'+taxi.earned+' • '+taxi.count+' client(s)','#ffd23f',3);taxi=null;}return;}

}
function drawHUD(){
  if(!started){drawTitle();return;}
  const pad=18;
  if(player.hurtT>0){const g=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.3,W/2,H/2,Math.max(W,H)*0.7);g.addColorStop(0,'rgba(255,0,0,0)');g.addColorStop(1,`rgba(255,0,0,${player.hurtT})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
  const hh=Math.floor(dayT*24),mn=Math.floor((dayT*24-hh)*60);
  txt(String(hh).padStart(2,'0')+':'+String(mn).padStart(2,'0'),W-pad,pad,'#fff','24px '+FONT,'right');
  txt('$'+String(Math.floor(dispMoney)).padStart(8,'0'),W-pad,pad+30,'#7CFC7C','30px '+FONT,'right');
  for(let i=0;i<5;i++){const on=i<wanted,fl=on&&unseen>0.6&&Math.floor(time*4)%2;star(W-pad-14-(4-i)*30,pad+86,12,on&&!fl?'#ffd23f':'rgba(255,255,255,0.15)');}
  const bw=150,bx=W-pad-bw;bar(bx,pad+108,bw,10,player.hp/100,'#e74c3c');if(player.armor>0)bar(bx,pad+124,bw,5,player.armor/100,'#3da5ff');
  const wp=WEAP[player.w],am=player.ammo[player.w];
  txt(wp.name+(am===Infinity?'':'  '+am),W-pad,pad+136,'#fff','bold 17px sans-serif','right');
  drawWeapons(W-pad,pad+160);
  if(player.drunk>0.05){txt(player.drunk>1.5?'Ivre mort':player.drunk>0.9?'Ivre':'Pompette',W-pad-158,pad+198,'#ffd060','bold 13px sans-serif','left');bar(W-pad-100,pad+201,100,6,player.drunk/2.3,'#ffb020');}
  if(player.swim)txt('À la nage',W/2,H*0.7,'#9fd8ff','bold 16px sans-serif','center');
  if(player.car){const c=player.car;txt(Math.round(hyp(c.vx,c.vy)*0.31)+' km/h',W-pad,H-pad-24,'#fff','26px '+FONT,'right','bottom');
    bar(W-pad-140,H-pad-14,140,7,c.hp/c.maxHp,c.hp<c.maxHp*0.35?'#ff7a1a':'#9be36b');
    txt(CT[c.type].name,W-pad-146,H-pad-10,'#ddd','bold 12px sans-serif','right','middle');}
  if(!player.inside)drawMinimap();
  drawNet();
  if(mission){const m=Math.max(0,Math.ceil(mission.time)),ts=Math.floor(m/60)+':'+String(m%60).padStart(2,'0');
    txt(mission.name,pad,pad,'#ffd23f','20px '+FONT);txt(mission.obj(),pad,pad+30,'#fff','bold 15px sans-serif');
    txt(ts,pad,pad+52,m<10&&Math.floor(time*4)%2?'#ff5252':'#fff','26px '+FONT);}
  else if(taxi){txt('JOB DE TAXI',pad,pad,'#ffd23f','20px '+FONT);txt(taxi.stage==='drive'?'Dépose le client à la colonne bleue':'Va chercher le client (colonne bleue)',pad,pad+30,'#fff','bold 15px sans-serif');
    txt('Gains : $'+taxi.earned+(taxi.stage==='drive'?'  •  pourboire : '+Math.max(0,Math.ceil(taxi.t))+' s':''),pad,pad+52,'#7CFC7C','bold 15px sans-serif');}
  else if(!MOBILE)txt(player.car&&player.car.type==='taxi'?'':'Va sur un « M » jaune pour une mission • prends un taxi pour bosser',pad,pad,'rgba(255,255,255,0.85)','bold 14px sans-serif');
  const t=missionTarget()||(waypoint?{x:waypoint.x,y:waypoint.y,col:'#40c0ff'}:null);if(t&&!player.inside)compass(t);
  if(areaShowT>0&&areaName){ctx.globalAlpha=clamp(areaShowT,0,1);txt(areaName,MOBILE?W/2:W-18,MOBILE?78:H-110,'#fff',(MOBILE?'17px ':'22px ')+FONT,MOBILE?'center':'right','bottom');ctx.globalAlpha=1;}
  if(!lap&&!player.car&&player.alive&&(nearMark()||nearDoor())){const mk=nearMark(),dr=nearDoor();txt(mk?'[E] '+mk.label:'[E] Entrer : '+dr.name,W/2,H*0.64,mk?'#ffd23f':'#ff4fd8','bold 17px sans-serif','center');}
  else if(!player.car&&player.alive&&!player.inside){const best=nearestCar();
    if(best)txt('[E] '+(best.driver&&best.driver!=='player'?'Voler : ':'Monter : ')+CT[best.type].name,W/2,H*0.64,'#fff','bold 16px sans-serif','center');}
  if(player.bustT>0)txt('ARRESTATION…',W/2,H*0.7,'#6aa0ff','22px '+FONT,'center');
  notes.forEach((n,i)=>{ctx.globalAlpha=clamp(n.life,0,1);txt(n.t,W/2,H-60-(notes.length-1-i)*26,'#fff','bold 17px sans-serif','center','bottom');});ctx.globalAlpha=1;
  if(big){const a=clamp(big.life*2,0,1)*clamp((big.max-big.life)*4,0,1);ctx.globalAlpha=a;
    txt(big.t,W/2,H*0.26,big.col,'44px '+FONT,'center','middle');if(big.sub)txt(big.sub,W/2,H*0.26+40,'#fff','bold 18px sans-serif','center','middle');ctx.globalAlpha=1;}
  if(!player.alive){ctx.fillStyle=deadKind==='busted'?'rgba(10,20,60,0.45)':'rgba(70,0,0,0.45)';ctx.fillRect(0,0,W,H);
    txt(deadKind==='busted'?'ARRÊTÉ':'MORT',W/2,H/2,deadKind==='busted'?'#6aa0ff':'#ff3b3b','72px '+FONT,'center','middle');}
  if(!MOBILE)txt('P/Échap : pause  •  G : qualité  •  M : son',W-pad,H-6,'rgba(255,255,255,0.45)','12px sans-serif','right','bottom');
  const showX=!lap&&!paused&&player.alive&&(player.car||!wp.melee);
  if(showX){const cx=W/2,cy=H/2,r=mouse.right?5:7;ctx.strokeStyle='rgba(255,255,255,0.9)';ctx.lineWidth=2;ctx.beginPath();
    ctx.arc(cx,cy,r,0,TAU);ctx.moveTo(cx-14,cy);ctx.lineTo(cx-r-2,cy);ctx.moveTo(cx+r+2,cy);ctx.lineTo(cx+14,cy);ctx.moveTo(cx,cy-14);ctx.lineTo(cx,cy-r-2);ctx.moveTo(cx,cy+r+2);ctx.lineTo(cx,cy+14);ctx.stroke();}
  else if(!lap&&!paused&&player.alive){ctx.fillStyle='rgba(255,255,255,0.7)';ctx.beginPath();ctx.arc(W/2,H/2,2.5,0,TAU);ctx.fill();}
  drawLap();
  if(mapOpen&&started)drawFullMap();
  if(paused)drawPause();
}
const HELP=[['ZQSD / WASD','Se déplacer / conduire'],['Souris','Caméra et visée'],['Clic gauche','Frapper / tirer'],['Clic droit','Viser (zoom épaule)'],['Espace','Sauter • frein à main en voiture'],['Maj','Courir'],['E','Monter / voler / sortir d\'un véhicule'],['1 à 7 / molette','Armes (1 = poings, sans arme)'],['V','Vue première / troisième personne'],['C','Carte (clic : repère GPS)'],['T','Tchat (et codes de triche)'],['R / H','Radio / klaxon (en voiture)'],['E (devant une porte)','Entrer : bar, club, armurerie, planque'],['G','Qualité graphique (si ça rame)'],['P / Échap','Pause'],['M','Couper le son']];
const HELP_M=[['Joystick (côté gauche)','Marcher / conduire'],['Glisser (côté droit)','Regarder autour'],['TIR','Tirer / frapper (visée assistée)'],['VISER','Viser à l\'épaule'],['SAUT','Sauter • frein à main en voiture'],['E','Monter, entrer, acheter, parler'],['ARME','Changer d\'arme'],['CARTE','Carte et repère GPS']];
function drawHelp(y){
  if(MOBILE){HELP_M.forEach(([k,v],i)=>{txt(k,W/2-10,y+i*24,'#ffd23f','bold 14px sans-serif','right');txt(v,W/2+10,y+i*24,'#fff','14px sans-serif','left');});return;}
  const w=Math.min(560,W-40),x=W/2-w/2;
  HELP.forEach(([k,v],i)=>{txt(k,x+w*0.42,y+i*25,'#ffd23f','bold 15px sans-serif','right');txt(v,x+w*0.46,y+i*25,'#fff','15px sans-serif','left');});
  const tips=['Colonne « M » jaune = mission  •  objets lumineux au sol = santé, gilet, armes, argent','Les crimes font monter les étoiles — semez la police ou passez à la CARROSSERIE (bleu)'];
  tips.forEach((t,i)=>txt(t,W/2,y+HELP.length*25+12+i*22,'rgba(255,255,255,0.85)','14px sans-serif','center'));
}
function drawTitle(){
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(5,8,15,0.75)');g.addColorStop(0.6,'rgba(5,8,15,0.35)');g.addColorStop(1,'rgba(5,8,15,0.7)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const y=H*0.11;
  txt('PORT NÉON',W/2,y,'#ff4fd8',Math.round(clamp(W/10,40,96))+'px '+FONT,'center','middle');
  txt('Monde ouvert • jour/nuit • météo dynamique',W/2,y+Math.min(60,W/14),'#5fd3ff','bold 20px sans-serif','center','middle');
  drawHelp(y+95);
  txt('MULTIJOUEUR : salle « '+roomName+' » — '+(remotes.size+1)+' joueur(s) connecté(s)  •  '+netStatus+'  •  version '+GAME_VERSION,W/2,H-92,'#7CFC7C','bold 15px sans-serif','center','middle');
  txt('TON PSEUDO',W/2,H-158,'#ff4fd8','bold 13px sans-serif','center','middle');
  if(Math.floor(time*2)%2)txt(MOBILE?'TOUCHE L\'ÉCRAN POUR JOUER':'CLIQUE POUR JOUER',W/2,H-50,'#fff','28px '+FONT,'center','middle');
}
function drawPause(){ctx.fillStyle='rgba(5,8,15,0.72)';ctx.fillRect(0,0,W,H);txt('PAUSE',W/2,H*0.09,'#fff','52px '+FONT,'center','middle');
  txt('Néons cachés : '+neonFound.size+' / '+neonsC.length+'   •   Sauts uniques : '+rampsDone.size+' / '+ramps.length,W/2,H-140,'#ff4fd8','bold 15px sans-serif','center');
  txt('O : contenu mature (18+) — '+(mature?'ACTIVÉ':'désactivé')+(performance.now()<matureArm?'  •  appuie à nouveau sur O pour confirmer':''),W/2,H-115,mature?'#ff4fd8':'rgba(255,255,255,0.7)','bold 15px sans-serif','center');
  drawHelp(H*0.09+50);txt('Kills : '+kills+'   •   Argent : $'+player.money,W/2,H-80,'#7CFC7C','bold 18px sans-serif','center');
  txt('Clique pour reprendre',W/2,H-45,'#fff','bold 20px sans-serif','center');}

window.__eval=s=>eval(s);
resize();
let last=performance.now();
function frame(now){
  let dt=Math.min(0.05,(now-last)/1000);last=now;if(player.car&&player.car.air)dt*=0.5;fps=fps*0.95+(1/Math.max(dt,0.001))*0.05;
  if(!paused)update(dt);else updateAudio();
  render(paused?0:dt);requestAnimationFrame(frame);
}
manager.onLoad=()=>{
  if(MOBILE){quality=0;sun.shadow.mapSize.set(1024,1024);if(gtao)gtao.enabled=false;fpsMode=false;composer.renderTarget1.samples=0;composer.renderTarget2.samples=0;resize();}
  player.look=makeLook('player');player.drunk=0;player.drinkT=0;loadSave();
  try{buildWorld();buildInteriors();buildActivities();}catch(e){console.error(e);loadTxt.textContent='Erreur : '+e.message;}
  dayT=((Date.now()/1000)/900+0.3)%1;initWorld();updateSky(0);startNet();
  loadUI.style.transition='opacity .8s';loadUI.style.opacity='0';setTimeout(()=>loadUI.remove(),900);
  last=performance.now();requestAnimationFrame(frame);
};
